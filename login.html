<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Sunrise Public School</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">

  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <i class="fas fa-graduation-cap"></i>
        <h2>Sunrise Public School</h2>
        <p>Admin & Teacher Login</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label><i class="fas fa-user"></i> Username</label>
          <input type="text" id="username" placeholder="Enter username" required>
        </div>
        <div class="form-group">
          <label><i class="fas fa-lock"></i> Password</label>
          <input type="password" id="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn-primary btn-full">Login</button>
        <p class="hint">Demo: admin / admin123</p>
        <p class="hint">Or: teacher / teacher123</p>
      </form>
      <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Website</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
